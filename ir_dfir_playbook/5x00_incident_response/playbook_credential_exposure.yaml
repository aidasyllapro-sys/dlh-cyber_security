playbook_id: PB-002
title: Credential Exposure via Phishing
owner_role: Technical_Lead
 
applies_to:
  triggers:
    - Confirmed phishing report where the user entered credentials on a fake Microsoft login page
    - Azure AD sign-in from an unfamiliar country or ASN within one hour of a reported credential entry
  indicators:
    - Sign-in from an unfamiliar country, ASN, or impossible-travel pattern shortly after a phishing click
    - Unexpected MFA approval or MFA push sent without a matching user-initiated login
    - New mailbox forwarding rule or OAuth application consent granted on the account
 
severity_mapping:
  initial: SEV2
  escalate_if:
    - ePHI was accessible from the compromised account during the exposure window
    - Evidence shows lateral movement originating from the compromised account
    - The account was used to access Epic or the Laboratory Information System during the exposure window
 
immediate_actions:
  - step: Confirm the phishing report and validate the sign-in anomaly against Azure AD sign-in logs
    owner: SOC Analyst
    timebox_minutes: 5
  - step: Notify IR_Commander and Technical_Lead per the SEV2 escalation path
    owner: SOC Analyst
    timebox_minutes: 5
  - step: Freeze further account activity at the application layer pending evidence capture, without yet resetting credentials
    owner: Technical_Lead
    timebox_minutes: 5
 
evidence_preservation:
  - artifact: Authentication logs for the account, last 30 days
    method: Export identity provider authentication events from Splunk SIEM
    before_step: Active Directory password reset
  - artifact: Azure AD sign-in log export for the account
    method: Export the Azure AD sign-in activity report for the flagged time window
    before_step: Azure AD session revocation
  - artifact: Affected mailbox export
    method: Export the full mailbox via eDiscovery content search before any mailbox or forwarding-rule changes
    before_step: MFA device reset
  - artifact: Recent data access audit export
    method: Export Epic and LIS access logs for the account covering the exposure window
    before_step: Epic session termination
 
containment_actions:
  - step: Reset the account's Active Directory password
    owner: Technical_Lead
    decision_point: N/A
    trade_off: Cuts off on-prem access immediately but signals the account owner is compromised, which may prompt the attacker to accelerate any remaining actions elsewhere
  - step: Revoke all active Azure AD sessions and refresh tokens for the account
    owner: Technical_Lead
    decision_point: Revoke immediately and lose visibility into the attacker's active session, or monitor briefly under Technical_Lead supervision to observe further attacker actions and risk continued access to Microsoft 365 data
    trade_off: Ends cloud access immediately but forecloses any chance to observe what the attacker intended to do next
  - step: Reset the account's registered MFA device
    owner: Technical_Lead
    decision_point: N/A
    trade_off: Blocks attacker re-authentication with a registered device, but requires the legitimate user to re-enroll MFA through an out-of-band verified channel, delaying their return to normal access
  - step: Revoke the account's VPN token
    owner: Technical_Lead
    decision_point: N/A
    trade_off: Blocks remote network access through VPN but also interrupts the legitimate user's own remote access until a new token is issued
  - step: Terminate all active Epic sessions for the account
    owner: Technical_Lead
    decision_point: N/A
    trade_off: Immediately stops any further ePHI access through Epic, but may interrupt in-progress clinical documentation by the legitimate user
 
eradication_actions:
  - Remove any mailbox forwarding rules or OAuth application consents created during the exposure window
  - Block the identified phishing domain and sending address at the email gateway
  - Rotate any shared credentials or service account secrets the compromised account could have reached
 
recovery_validation:
  - check: Confirm no active sessions remain for the account across Active Directory and Azure AD
    criterion: Sign-in logs and active session lists show zero active sessions after containment
  - check: Confirm MFA re-enrollment by the legitimate user through an out-of-band verified channel
    criterion: A new MFA device is registered and the user's identity is verified by phone call to their known number before re-enabling access
  - check: Confirm no further mailbox rule changes or data exports occurred after containment
    criterion: Mailbox audit log shows no rule or export activity following the containment timestamp
 
communication_plan:
  - audience: IR_Commander
    trigger: Immediately on SEV2 declaration
    template: ir_commander_notification.md
  - audience: Legal_Liaison
    trigger: As soon as ePHI access during the exposure window is confirmed or cannot be ruled out
    template: hipaa_assessment_trigger.md
  - audience: Affected user
    trigger: Once containment actions are complete, before password and MFA are reissued
    template: user_account_reset_notice.md
  - audience: Executive_Sponsor
    trigger: If severity escalates to SEV1 per severity_mapping.escalate_if
    template: executive_escalation_brief.md
 
escalation_triggers:
  - Confirmed ePHI access from the compromised account during the exposure window
  - Evidence of lateral movement beyond the single compromised account
  - Attacker activity continues after containment actions have been executed
 
post_incident_tasks:
  - Document whether the HIPAA Breach Notification Rule threshold was met, based on the Legal_Liaison's ePHI access assessment
  - Review why the phishing email bypassed existing email security controls
  - Update security awareness training content with this specific phishing lure pattern
  - Record which option was taken at the Azure AD session revocation decision point, and its outcome, for the post-incident review

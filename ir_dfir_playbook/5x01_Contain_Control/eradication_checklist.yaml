  - id: ERAD-012
    category: krbtgt
    target_host: domain
    description: Double-reset of the krbtgt account password following confirmed Pass-the-Ticket
    command_or_action: Reset-ADAccountPassword -Identity krbtgt (twice, with full AD replication convergence between the two resets)
    rationale: Pass-the-Ticket was confirmed on dmarsh (consecutive TGS_REQ events from WST-WS-031 to WST-WS-017 to LIS-WSIDE-01 reusing the same session without fresh interactive logon). A single krbtgt reset still leaves tickets forged against the prior password's second-most-recent hash valid; a double reset with replication convergence between resets is required to invalidate all outstanding forged TGTs domain-wide.
    verification_command: audit TGT issuance timestamps domain-wide and confirm no session uses a ticket issued before the second reset
    expected_verification_result: no valid TGTs found with an issuance timestamp earlier than the second krbtgt reset
    status: pending
    executed_at: null
    executed_by: null
 

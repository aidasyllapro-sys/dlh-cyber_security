    target_host: WST-WS-031
    description: Remove dropper files update.zip, update.xml, update.exe from Downloads and Temp
    command_or_action: Remove-Item on all three paths
    verification_command: Test-Path on all three paths plus endpoint live-response file listing of the Temp folder
    expected_verification_result: all three paths return false and live-response shows no match
    status: pending
    executed_at: null
    executed_by: null
 

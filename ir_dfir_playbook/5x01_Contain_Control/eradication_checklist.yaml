  - id: ERAD-008
    category: credential
    target_host: domain
    description: Reset dmarsh AD password and revoke Azure AD sessions and refresh tokens
    command_or_action: Set-ADAccountPassword -Identity dmarsh -Reset; Revoke-AzureADUserAllRefreshToken -ObjectId dmarsh
    verification_command: query Azure AD sign-in logs and AD logon events for dmarsh for sign-ins using tokens or Kerberos material issued before the reset
    expected_verification_result: no successful sign-in using material issued before the reset timestamp
    status: pending
    executed_at: null
    executed_by: null
 

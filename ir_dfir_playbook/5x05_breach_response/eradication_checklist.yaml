  executed_by: null

- id: ERAD-021
  category: kerberos
  target_host: ALL-6
  description: >-
    Purge cached Kerberos tickets for jdoe's compromised session on every
    affected host (Kerberos was the confirmed auth protocol for the FILE-SVR-01
    lateral logon, FS-003); not a krbtgt double-reset scenario — no evidence of
    ticket forgery (golden/silver ticket), only credential reuse was observed
  command_or_action: "klist purge -li 0x3e7; klist purge"

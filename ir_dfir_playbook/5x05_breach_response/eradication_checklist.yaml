- id: ERAD-013
  category: persistence
  target_host: ALL-6
  description: >-
    Sweep for additional persistence mechanisms (registry Run/RunOnce keys,
    scheduled tasks) not directly evidenced in current artifacts. No Run-key or
    scheduled-task persistence was found in the Sysmon sample — this is a
    defensive verification, not removal of a confirmed finding.
  command_or_action: >-
    Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run';
    Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run';
    Get-ScheduledTask | Where-Object {$_.TaskPath -notlike '\Microsoft\Windows\*'}
  verification_command: same as command_or_action, re-run post-sweep
  expected_verification_result: "no unrecognized Run/RunOnce entries; no unrecognized scheduled tasks referencing svchost32.exe or ProgramData\\Microsoft"
  status: pending
  executed_at: null
  executed_by: null


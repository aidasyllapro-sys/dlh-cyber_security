# Eradication Checklist: IR-2026-0420-01
#
# Scope note: covers 6 hosts, not 5 — SCHED-SVR-01 is included per the compromise
# confirmed in forensic_findings.md (SYSMON-008), outside the task's original 5-host
# framing but consistent with containment_decision.md's scope expansion.
#
# Status note: no item in this file has been executed in this environment (no live
# hosts, EDR console, or SIEM are reachable here). Every item starts as `pending`.
# An item may only be set to `completed` by the executing analyst once
# verification_command has actually been run and its real output matches
# expected_verification_result. Do not mark `completed` from this plan alone.

- id: ERAD-001
  category: beacon_process
  target_host: CS-WS-101
  description: Terminate the Cobalt Strike beacon process and its process tree
  command_or_action: "Get-Process -Name svchost32 | Where-Object {$_.Path -eq 'C:\\ProgramData\\Microsoft\\svchost32.exe'} | Stop-Process -Force"
  verification_command: "Get-Process -Name svchost32 -ErrorAction SilentlyContinue; tasklist | findstr /i svchost32"
  expected_verification_result: "no process named svchost32.exe running from C:\\ProgramData\\Microsoft\\"
  status: pending
  executed_at: null
  executed_by: null


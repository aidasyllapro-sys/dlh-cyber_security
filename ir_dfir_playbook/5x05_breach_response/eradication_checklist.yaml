- id: ERAD-020
  category: credential
  target_host: ALL-6
  description: >-
    Confirm MEDDEFENSE\jdoe remains disabled, password reset, all sessions
    terminated (action already taken in containment_execution.md, 21:25Z);
    sweep for any additional accounts created during the 72h dwell window — no
    account-creation events were found in the available Sysmon/file-server

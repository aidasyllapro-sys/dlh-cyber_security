%YAML 1.1
---
# Generated by 8-suricata_setup.sh - offline PCAP replay configuration.
# This project never runs suricata as a live daemon on an interface;
# every invocation points -r at a provided PCAP. suricata.service is
# never started.

vars:
  address-groups:
    HOME_NET: "[10.10.0.0/16]"
    EXTERNAL_NET: "!$HOME_NET"

default-log-dir: /var/log/suricata

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - http
        - dns
        - tls

logging:
  default-log-level: notice

default-rule-path: /var/lib/suricata/rules

rule-files:
  - local.rules
  - meddefense.rules

pcap-file:
  enabled: yes
  checksum-checks: auto

af-packet:
  - interface: default

app-layer:
  protocols:
    tls:
      enabled: yes
    http:
      enabled: yes
    dns:
      enabled: yes
